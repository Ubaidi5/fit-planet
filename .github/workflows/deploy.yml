name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /var/www/fitplanet
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned through package.json's packageManager field
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

      - name: Build (standalone)
        run: bun run build
        env:
          # NEXT_PUBLIC_* values are inlined into the browser bundle at build time,
          # so they come from repository variables (Settings > Secrets and variables > Actions > Variables).
          APP_URL: ${{ vars.APP_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

      - name: Package release
        run: |
          mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          cp -r public release/public
          cp deploy/fitplanet.service release/
          tar -czf release.tgz -C release .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.LIGHTSAIL_PORT || 22 }}" -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and activate
        env:
          SSH: ssh -i ~/.ssh/id_deploy -p ${{ secrets.LIGHTSAIL_PORT || 22 }} ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}
          SCP_TARGET: ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          BUN_VERSION="$(bun --version)"
          scp -i ~/.ssh/id_deploy -P ${{ secrets.LIGHTSAIL_PORT || 22 }} release.tgz "$SCP_TARGET:/tmp/fitplanet-$RELEASE.tgz"
          scp -i ~/.ssh/id_deploy -P ${{ secrets.LIGHTSAIL_PORT || 22 }} deploy/activate.sh "$SCP_TARGET:/tmp/fitplanet-activate.sh"
          $SSH "bash /tmp/fitplanet-activate.sh '$APP_DIR' '$RELEASE' '$BUN_VERSION' && rm -f /tmp/fitplanet-activate.sh"
