# Fit Planet locations, included from the HTTPS server block of your site:
#   include /var/www/fitplanet/nginx/nginx-locations.conf;
# Needs nginx-zone.conf in /etc/nginx/conf.d/ for the upstream and rate limit.

# Gym photos and videos are uploaded through the app (server actions)
client_max_body_size 15m;
server_tokens off;

# Drop clients that send headers or bodies too slowly (slowloris-style floods)
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;
limit_conn fitplanet_conn 40;

# Uploaded media straight from disk (STORAGE_PROVIDER=local)
location /media/ {
  alias /var/www/fitplanet/shared/uploads/;
  access_log off;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable";
  # Uploads are only ever images or video: never let a browser run one as a page
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
  try_files $uri =404;
}

# Hashed build assets never change
location /_next/static/ {
  alias /var/www/fitplanet/current/.next/static/;
  access_log off;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
  limit_req zone=fitplanet_req burst=60 nodelay;
  limit_req zone=fitplanet_write burst=20 nodelay;
  proxy_pass http://fitplanet_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_read_timeout 60s;
}
