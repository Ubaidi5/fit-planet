# /etc/nginx/sites-available/fitplanet, for a fresh server (setup-server.sh
# installs it and certbot then adds the HTTPS server block and redirect).
# On a server that already has a site for the domain, don't use this file:
# include nginx-locations.conf in your existing HTTPS server block instead.
server {
  listen 80;
  listen [::]:80;
  server_name fitplanet.example.com;

  include /var/www/fitplanet/nginx/nginx-locations.conf;
}
