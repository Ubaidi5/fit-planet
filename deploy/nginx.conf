# /etc/nginx/sites-available/fitplanet
# Replace fitplanet.example.com with your domain, then run certbot (see setup-server.sh).

upstream fitplanet_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name fitplanet.example.com;

  # Gym photos and videos are uploaded through the app (server actions)
  client_max_body_size 15m;

  # Uploaded media straight from disk (STORAGE_PROVIDER=local)
  location /media/ {
    alias /var/www/fitplanet/shared/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Hashed build assets never change
  location /_next/static/ {
    alias /var/www/fitplanet/current/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://fitplanet_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
