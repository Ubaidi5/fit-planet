# /etc/nginx/conf.d/fitplanet-zone.conf (http level)
# Flood protection per client IP; the app adds finer limits on sign-in, sign-up and posting
limit_req_zone $binary_remote_addr zone=fitplanet_req:10m rate=15r/s;
# Form posts and server actions (sign-in, bookings, uploads) do real work, so
# they get a tighter budget; GET requests leave the key empty and aren't counted
map $request_method $fitplanet_write_key {
  default "";
  POST    $binary_remote_addr;
  PUT     $binary_remote_addr;
  PATCH   $binary_remote_addr;
  DELETE  $binary_remote_addr;
}
limit_req_zone $fitplanet_write_key zone=fitplanet_write:10m rate=5r/s;
# Open connections per IP, against slow-connection floods
limit_conn_zone $binary_remote_addr zone=fitplanet_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream fitplanet_app {
  server 127.0.0.1:3000;
  keepalive 32;
}
