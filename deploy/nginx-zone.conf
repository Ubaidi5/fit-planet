# /etc/nginx/conf.d/fitplanet-zone.conf (http level)
# Flood protection per client IP; the app adds finer limits on sign-in, sign-up and posting
limit_req_zone $binary_remote_addr zone=fitplanet_req:10m rate=15r/s;
limit_req_status 429;

upstream fitplanet_app {
  server 127.0.0.1:3000;
  keepalive 32;
}
